<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web assignment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container-fluid border bg-black text-white" style="margin-bottom: 20px;">
        <div class="row gx-5">
            <div class="col">
                <span class="bg-primary" style="color: rgb(18, 228, 12); width: 6rem; margin-top: 20px; margin-left: 20px; border: solid; text-align: center; background-color: #000;">Web design</span>
                <h1 style="color: azure;">web design workshop</h1>
                <p style="color: rgb(238, 224, 24); margin-left: 10px;">any building of websites</p>
            </div>
        </div>
    </div>
    <div class="container border p-4" style="margin-top: 40px;">
        <div class="row gx-5">
            <div class="col md-3 border p-4 m-5" style="margin-top: 20px;">
                <h1>Workshop Program</h1>
                <p style="margin-bottom: 10px; font-weight: bold;">day</p>
                <p style="margin-bottom: 10px; font-weight: normal;">saturday</p>
                <p style="margin-bottom: 10px; font-weight: bold;">time</p>
                <p style="margin-bottom: 10px; font-weight: normal;">in 3 sessions</p>
            </div>
            <div class="col-6 md-3 border p-4 m-5" style="margin-top: 20px;">
                <h1 style="text-align: center;">REGISTER</h1>
                <p style="margin-bottom: 20px;">enter email</p>
                <input type="email" placeholder="enter your email" class="form-control" style="margin-bottom: 20px;">
                <button type="submit" class="theme-primary btn-solid btn-styled" style="margin-bottom: 20px;">submit</button>
                <p style="margin-bottom: 20px;">enter password</p>
                <input type="text" placeholder="enter your password" class="form-control" style="margin-bottom: 20px;">
                <button type="submit" class="theme-primary btn-solid btn-styled" style="margin-bottom: 20px;">submit</button>
                <p style="margin-bottom: 20px;">select a session</p>
                <input type="radio" id="morning" name="session" value="morning">
                <label for="morning">Morning session</label><br>
                <input type="radio" id="afternoon" name="session" value="afternoon">
                <label for="afternoon">Afternoon session</label><br>
                <input type="radio" id="evening" name="session" value="evening">
                <label for="evening">Evening session</label><br>
                <p style="margin-bottom: 20px;" class="fs-6"><small>
                    practice entries are discarded after 24 hours. please make sure to submit your entries before the deadline.
                </small></p>
            </div>
        </div>
    </div>
</body>
</html>
